[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "craftax_voyage"
version = "1.0.0"
authors = [
  
]
description = ""
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "jax[cuda12]",
    "openai",
    "flax",
    "numpy",
    "pygame",
    "matplotlib",
    "imageio",
    "langchain==0.2.17",
    "langchain-community",
    "chromadb",
    "vllm"
]

[tool.setuptools.packages.find]
include=["craftax-voyage*"]